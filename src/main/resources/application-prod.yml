# ──────────────────────────────────────────
# ACTUATOR - Métricas para pruebas de carga
# ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      roles: Administrador
    prometheus:
      enabled: true
  metrics:
    tags:
      application: agroruta-backend
      environment: prod

# ──────────────────────────────────────────
# HIKARI - Pool de conexiones (crítico en pruebas de carga)
# ──────────────────────────────────────────
spring:
  datasource:
    hikari:
      maximum-pool-size: 50    # era 20
      minimum-idle: 10         # era 5
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: AgroRuta-HikariPool

# ──────────────────────────────────────────
# SWAGGER - apagado en produccion
# ──────────────────────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false