# ──────────────────────────────────────────
# ACTUATOR - Métricas para pruebas de carga
# ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      roles: Administrador
    prometheus:
      enabled: true
  metrics:
    tags:
      application: agroruta-backend
      environment: prod

# ──────────────────────────────────────────
# HIKARI - Pool de conexiones
# 10 alcanza para el uso normal y no agota la memoria de Render ni las conexiones de TiDB.
# Para una prueba de carga se puede subir con las variables DB_POOL_MAX / DB_POOL_MIN.
# ──────────────────────────────────────────
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: AgroRuta-HikariPool

# ──────────────────────────────────────────
# SWAGGER - apagado en produccion
# ──────────────────────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false