spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

weather.api.key=${WEATHER_API_KEY}
weather.api.base-url=https://api.openweathermap.org/data/2.5
logging.config=classpath:logback-spring.xml
logging.file.path=logs
app.cors.allowed-origins=http://localhost:4200

# Flyway lo manejamos manualmente en el Bean
spring.flyway.enabled=false

backup.directory=${BACKUP_DIR:backups}
backup.retention=${BACKUP_RETENTION:10}
backup.cron=${BACKUP_CRON:0 0 2 * * *}
backup.scheduler-enabled=${BACKUP_SCHEDULER_ENABLED:true}
backup.ssl-arg=${BACKUP_SSL_ARG:}
backup.mysqldump-path=${BACKUP_MYSQLDUMP_PATH:mysqldump}
backup.mysql-path=${BACKUP_MYSQL_PATH:mysql}
# En TiDB (Render) poner BACKUP_SINGLE_TRANSACTION=false
backup.single-transaction=${BACKUP_SINGLE_TRANSACTION:true}

# En Windows, si mysqldump no esta en el PATH, define estas variables de entorno:
#   BACKUP_MYSQLDUMP_PATH=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe
#   BACKUP_MYSQL_PATH=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysql.exe