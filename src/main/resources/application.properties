spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway crea y cambia las tablas (db/migration); Hibernate solo revisa que coincidan con las entidades
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}

jwt.secret=${JWT_SECRET}
# Token de acceso: 15 min. Se renueva solo con la cookie de sesión (app.sesion.*)
jwt.expiration=${JWT_EXPIRATION:900000}
# Sesión renovable (refresh token en cookie httpOnly). En local por http se puede poner COOKIE_SEGURA=false
app.sesion.duracion-dias=${SESION_DIAS:30}
app.sesion.cookie-segura=${COOKIE_SEGURA:true}

weather.api.key=${WEATHER_API_KEY}
weather.api.base-url=https://api.openweathermap.org/data/2.5
logging.config=classpath:logback-spring.xml
logging.file.path=logs
app.cors.allowed-origins=http://localhost:4200

# Correos (API de Gmail por HTTPS; Render gratis bloquea SMTP). Sin estas variables, los correos solo van al log.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
correo.gmail.client-id=${GMAIL_CLIENT_ID:}
correo.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
correo.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
correo.remitente=${CORREO_REMITENTE:}
# En local muestra el texto de los correos en el log (incluido el enlace de recuperar contraseña)
correo.log-contenido=${CORREO_LOG_CONTENIDO:true}
# Las cuentas nuevas deben confirmar el correo antes de entrar (false = como antes)
correo.verificar-registro=${VERIFICAR_CORREO:true}
# Clave para que GitHub Actions dispare el resumen diario (POST /api/jobs/daily-alerts)
tareas.token=${TAREAS_TOKEN:}

# Diagnóstico de plagas con foto (API de Gemini, de Google). Sin GEMINI_API_KEY queda apagado.
# La clave se saca en https://aistudio.google.com. Cada foto gasta cupo de esa cuenta: por eso hay topes diarios.
app.diagnostico.api-key=${GEMINI_API_KEY:}
app.diagnostico.modelo=${DIAGNOSTICO_MODELO:gemini-3.8-flash}
# Si el modelo principal está saturado o no responde a tiempo, se prueba con estos, en orden.
app.diagnostico.modelos-respaldo=${DIAGNOSTICO_MODELOS_RESPALDO:gemini-3.6-flash,gemini-3.5-flash-lite}
app.diagnostico.max-por-dia=${DIAGNOSTICO_MAX_POR_DIA:15}
app.diagnostico.max-total-dia=${DIAGNOSTICO_MAX_TOTAL_DIA:300}
# La foto llega ya reducida desde la app; el tope es para envíos hechos por fuera
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# Flyway lo manejamos manualmente en el Bean
spring.flyway.enabled=false

backup.directory=${BACKUP_DIR:backups}
backup.retention=${BACKUP_RETENTION:10}
backup.cron=${BACKUP_CRON:0 0 2 * * *}
backup.scheduler-enabled=${BACKUP_SCHEDULER_ENABLED:true}
backup.ssl-arg=${BACKUP_SSL_ARG:}
backup.mysqldump-path=${BACKUP_MYSQLDUMP_PATH:mysqldump}
backup.mysql-path=${BACKUP_MYSQL_PATH:mysql}
# En TiDB (Render) poner BACKUP_SINGLE_TRANSACTION=false
backup.single-transaction=${BACKUP_SINGLE_TRANSACTION:true}

# En Windows, si mysqldump no esta en el PATH, define estas variables de entorno:
#   BACKUP_MYSQLDUMP_PATH=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe
#   BACKUP_MYSQL_PATH=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysql.exe