# Perfil de producción (Render). Se suma a application.properties.

# ──────────────────────────────────────────
# ACTUATOR - Métricas para pruebas de carga
# ──────────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=Administrador
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=agroruta-backend
management.metrics.tags.environment=prod

# ──────────────────────────────────────────
# HIKARI - Pool de conexiones
# 10 alcanza para el uso normal y no agota la memoria de Render ni las conexiones de TiDB.
# Para una prueba de carga se puede subir con las variables DB_POOL_MAX / DB_POOL_MIN.
# ──────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=AgroRuta-HikariPool

# ──────────────────────────────────────────
# SWAGGER - apagado en producción
# ──────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ──────────────────────────────────────────
# CORREOS - en producción no se escribe el contenido en el log (lleva enlaces de recuperación)
# ──────────────────────────────────────────
correo.log-contenido=false
